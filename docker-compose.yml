version: '3.8'
services:
  postgres:
    image: postgres:14
    container_name: ludo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ludo_db
    ports:
      - "5432:5432"
    volumes:
      - ludo_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  ludo_pgdata:
